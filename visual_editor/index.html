<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ren'Py Visual Editor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside id="sidebar" class="sidebar is-open">
        <div class="sidebar-scroll">
          <header class="sidebar-header">
            <div>
              <p class="eyebrow">Prototype</p>
              <h1>Ren'Py Visual Editor</h1>
            </div>
          </header>

          <section id="quickActionsSection" class="sidebar-section">
            <p class="section-label">Quick Actions</p>
            <div class="sidebar-actions">
              <button id="newGraphButton" class="secondary">New Graph</button>
              <button id="saveDraftButton" class="secondary">Save Draft</button>
              <button id="exportButton" class="primary">Export to .rpy</button>
            </div>
          </section>

          <section id="projectDetailsSection" class="sidebar-section">
            <p class="section-label">Current Project</p>
            <p id="projectPath" class="project-path">No project path provided.</p>
            <p class="section-label secondary-label">Expected Files</p>
            <p id="projectFiles" class="project-files"></p>
          </section>

          <section id="statusSection" class="sidebar-section status-section">
            <p class="section-label">Status</p>
            <p id="statusText" class="status-text">Visual editor scaffold ready.</p>
          </section>
        </div>
      </aside>

      <div class="sidebar-controls">
        <button id="sidebarHideButton" class="sidebar-hide-button" type="button" aria-expanded="true">
          Hide
        </button>

        <div id="sidebarCollapsedRail" class="sidebar-collapsed-rail" aria-label="Sidebar shortcuts">
          <button
            class="collapsed-rail-button"
            type="button"
            data-sidebar-section="quickActionsSection"
            aria-label="Open quick actions"
            title="Quick Actions"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <line x1="5" y1="6" x2="19" y2="6"></line>
              <circle cx="9" cy="6" r="2"></circle>
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <circle cx="15" cy="12" r="2"></circle>
              <line x1="5" y1="18" x2="19" y2="18"></line>
              <circle cx="11" cy="18" r="2"></circle>
            </svg>
          </button>

          <button
            class="collapsed-rail-button"
            type="button"
            data-sidebar-section="projectDetailsSection"
            aria-label="Open details"
            title="Details"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="5" y="4" width="14" height="16" rx="2"></rect>
              <line x1="8" y1="9" x2="16" y2="9"></line>
              <line x1="8" y1="13" x2="16" y2="13"></line>
              <line x1="8" y1="17" x2="13" y2="17"></line>
            </svg>
          </button>

          <button
            class="collapsed-rail-button"
            type="button"
            data-sidebar-section="statusSection"
            aria-label="Open status"
            title="Status"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="8"></circle>
              <line x1="12" y1="10" x2="12" y2="16"></line>
              <circle cx="12" cy="7" r="1"></circle>
            </svg>
          </button>
        </div>
      </div>

      <main class="canvas-stage">
        <div id="canvas" class="canvas-surface">
          <div class="grid-overlay"></div>
          <div id="graphNodes" class="graph-nodes"></div>
        </div>
      </main>

      <section id="addBlockDock" class="add-block-dock is-offset-for-inspector">
        <div id="addBlockMenu" class="add-block-menu">
          <button class="node-card node-card-compact" data-node-type="start">
            <strong>Start</strong>
            <span>Entry</span>
          </button>

          <button class="node-card node-card-compact" data-node-type="dialogue">
            <strong>Dialogue</strong>
            <span>Line</span>
          </button>

          <button class="node-card node-card-compact" data-node-type="menu">
            <strong>Choice</strong>
            <span>Branch</span>
          </button>

          <button class="node-card node-card-compact" data-node-type="jump">
            <strong>Jump</strong>
            <span>Goto</span>
          </button>
        </div>

        <button
          id="addBlockToggleButton"
          class="add-block-toggle"
          type="button"
          aria-label="Add block"
          aria-controls="addBlockMenu"
          aria-expanded="false"
        >
          <span aria-hidden="true">+</span>
        </button>
      </section>

      <aside id="inspectorSidebar" class="inspector-sidebar is-open">
        <section class="inspector-panel">
          <div class="section-header">
            <h2>Inspector</h2>
            <p>Details for the selected node.</p>
          </div>

          <div id="inspectorEmpty" class="inspector-empty">
            <p>Select a node to inspect its properties.</p>
          </div>

          <form id="inspectorForm" class="inspector-form hidden">
            <label>
              Node Id
              <input id="nodeIdInput" type="text" readonly />
            </label>

            <label>
              Node Type
              <input id="nodeTypeInput" type="text" readonly />
            </label>

            <label>
              Title
              <input id="nodeTitleInput" type="text" />
            </label>

            <label>
              Content
              <textarea id="nodeContentInput" rows="8"></textarea>
            </label>

            <div class="inspector-actions">
              <button id="deleteNodeButton" class="danger-button" type="button">Delete Block</button>
            </div>
          </form>
        </section>
      </aside>

      <div id="nodeContextMenu" class="node-context-menu" role="menu">
        <button id="contextDeleteButton" class="node-context-menu-item danger-text" type="button" role="menuitem">
          Delete Block
        </button>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
